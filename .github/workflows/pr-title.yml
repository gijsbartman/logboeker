name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  lint:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must not start with an
            uppercase character.

      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && steps.lint.outputs.error_message != null
        with:
          header: pr-title-lint
          message: |
            PR titles become the squashed commit message, which drives the
            version bump and changelog — they must follow
            [Conventional Commits](https://www.conventionalcommits.org):

            ${{ steps.lint.outputs.error_message }}

            ```
            feat(editor): add label autocomplete
            ^    ^        ^
            |    |        |__ subject (lowercase start)
            |    |___________ scope (optional)
            |________________ type
            ```

      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.lint.outputs.error_message == null
        with:
          header: pr-title-lint
          delete: true
